<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crachá Grid</title>
  <link rel="stylesheet" href="./css/cracha.css">
</head>
<body>
  <div class="content">
    <div class="menu">menu

      <input id="name" type="text" placeholder="Nome">
      <input type="text" placeholder="cargo">
    </div>
    <div class="view view-container">
      <section class="front zoon">
        <div class="container">
          <div class="item corner"></div>
          <div class="item white"></div>
          <div class="item corner"></div>
          <div class="item white"></div>
          <div class="item blue-area mark">
            <div class="pitoco mark"></div>
            <div class="data">
              <img class="avatar" src="./img/avatar.png" alt="" srcset="">
             <div class="texto">
              <h2 class="funcionario">Antonio Estevam</h2>
             <h3>cargo</h3>
             </div>
             <img src="./img/brand.png" alt="" srcset="">
            </div>
          </div>
          <div class="item white"></div>
          <div class="item corner"></div>
          <div class="item white"></div>
          <div class="item corner"></div>
        </div>
      </section>
      <section class="back zoon ">
        <div class="container">
          <div class="item corner"></div>
          <div class="item white"></div>
          <div class="item corner"></div>
          <div class="item white"></div>
          <div class="item blue-area mark">
            <div class="pitoco mark"></div>
          </div>
          <div class="item white"></div>
          <div class="item corner"></div>
          <div class="item white"></div>
          <div class="item corner"></div>
        </div>
      </section>
    </div>
  </div>
  <script src="./js/cracha.js"></script>
</body>
</html>
